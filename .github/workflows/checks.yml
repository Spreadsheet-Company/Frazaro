# The static ratchets, on every push and pull request.
#
# Every tools/check_*.ps1 is host-independent by design (no Excel, no COM),
# which is exactly what makes it runnable here. The goldens, the self-tests
# and the live pass still need Excel and stay the owner's job; this workflow
# is the mechanical half of review, so a pull request from anyone has run
# the ratchets before a human reads it. tools/release.ps1 runs the same
# scripts locally before it will tag a release.
#
# Since 2026-10-01 (PORT.4) the Cargo workspace is built here too: the
# host-free core and its command-line door (docs/HORIZON.md section 12).
# The VBA reference cannot run here and never will; it testifies through
# the goldens it produced, and tools/prove.ps1 is the runner that holds any
# other implementation to them (conformance/README.md). The wasm build's
# import section is read on the artifact itself, so SD-13 is checked on
# the file, not taken on faith.
#
# Since 2026-10-21 (AS.10) the work is six jobs side by side, where the
# workspace's was one job of about eight minutes, every step after the
# last:
# - ratchets runs tools/run_checks.ps1 under Windows PowerShell 5.1, the
#   checks side by side and their count held to its floor, every check's
#   output kept in the log;
# - test builds, format-checks, lints and tests the workspace, its tests
#   optimized by the dev profile of Cargo.toml (opt-level 1, its debug
#   assertions and overflow checks on);
# - package runs the language's published package's own tests from its
#   tarball, whose manifest carries no profile of the workspace's, so the
#   same optimization is given it here;
# - wasm builds the two modules in the release profile, reads their imports
#   and exports off the files, and builds the page from the core's;
# - door builds the door and holds it to the treaty's goldens and the
#   census, the door optimized as the tests are (the census of the bench
#   programs took a minute and a half through an unoptimized door);
# - floors builds the recalculation floors' two runners in the dev profile,
#   whose check modes print what the release profile's print byte for byte,
#   and holds their values and bytes.
name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ratchets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: run every tools/check_*.ps1, side by side, their count held to its floor (AS.10)
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/run_checks.ps1 -ShowAll
          exit $LASTEXITCODE
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: build, format-check, lint and test the workspace
        run: |
          cargo build --workspace
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p vla-lang --all-targets --features c-abi -- -D warnings
          cargo test --workspace
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the language's published package runs its own tests, outside this repository (VLA.1), optimized as the workspace's tests are (AS.10)
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '1'
          CARGO_PROFILE_DEV_DEBUG: 'line-tables-only'
        run: |
          cargo package -p vla-lang --locked
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vla-lang") | .version')
          mkdir -p "$RUNNER_TEMP/vla-lang-package"
          tar -xzf "target/package/vla-lang-$version.crate" -C "$RUNNER_TEMP/vla-lang-package"
          cargo test --locked --manifest-path "$RUNNER_TEMP/vla-lang-package/vla-lang-$version/Cargo.toml"
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: build the wasm core
        run: cargo build --release -p frazaro-core --target wasm32-unknown-unknown
      - name: build the wasm language crate, with the machine's C surface (PORT.12; KERNEL.22)
        run: cargo build --release -p vla-lang --features c-abi --target wasm32-unknown-unknown
      - name: the core and the language import nothing (SD-13, read off both artifacts; PORT.12)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_core_imports.ps1
      - name: the core and the language export exactly their lists (KERNEL.22)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/check_wasm_exports.ps1
          pwsh -NoProfile -File tools/check_wasm_exports.ps1 -Control
      - name: build the web page from the wasm core (PORT.6, slice 6h)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/build_web.ps1 -NoBuild
          pwsh -NoProfile -File tools/check_web_offline.ps1
      - name: keep the wasm core
        uses: actions/upload-artifact@v4
        with:
          name: frazaro_core.wasm
          path: target/wasm32-unknown-unknown/release/frazaro_core.wasm
      - name: keep the web page
        uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: web/index.html
  door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the door, optimized as the workspace's tests are (AS.10)
        run: cargo build -p frazaro
      - name: the conformance runner proves itself
        shell: pwsh
        run: pwsh -NoProfile -File tools/prove.ps1 -Control
      - name: the core reproduces the compile golden (PORT.5, oracle 1b)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/check_compile_prefix.ps1 -Impl target/debug/frazaro
          pwsh -NoProfile -File tools/check_translate_prefix.ps1 -Impl target/debug/frazaro
          pwsh -NoProfile -File tools/prove.ps1 -Impl target/debug/frazaro -ShowAll
      - name: the core's passing phrasebook proofs never go down (PORT.6, oracle 3)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_prove_floors.ps1 -Impl target/debug/frazaro
      - name: the door's built-in prelude and english.vla are the corpus files, in the bytes and in the door
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_crate_data.ps1 -Impl target/debug/frazaro
      - name: the core reproduces the build golden, byte for byte (PORT.7, oracle 7)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_build_golden.ps1 -Impl target/debug/frazaro
      - name: the core reproduces the reflect goldens, whole (PORT.8, oracle 8)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_reflect_golden.ps1 -Impl target/debug/frazaro
      - name: the core reproduces the diff goldens, whole (PORT.8 slice 8c, oracle 9)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_diff_golden.ps1 -Impl target/debug/frazaro
      - name: the core reproduces the audit goldens, whole (PORT.8 slice 8d, oracle 10)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_audit_golden.ps1 -Impl target/debug/frazaro
      - name: the core reproduces the view goldens, whole (KERNEL.4, oracle 11)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_view_golden.ps1 -Impl target/debug/frazaro
      - name: the core reproduces the recalc goldens, whole, every saved value agreeing (KERNEL.7, oracle 12)
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_recalc_golden.ps1 -Impl target/debug/frazaro
      - name: the door's census of the recalc fixtures and the bench programs, whole (KERNEL.30)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/check_shapes_golden.ps1 -Impl target/debug/frazaro
          pwsh -NoProfile -File tools/check_shapes_golden.ps1 -Control
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the recalculation floors' two runners, in the dev profile (AS.10)
        run: cargo build -p frazaro-core --example recalc --example memory
      - name: the machine's values held on the fixtures the recalculation floors were measured on (KERNEL.20), and its bytes under their ceilings (KERNEL.49)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/check_recalc_floors.ps1 -Runner target/debug/examples/recalc -MemoryRunner target/debug/examples/memory
          pwsh -NoProfile -File tools/check_recalc_floors.ps1 -Control
