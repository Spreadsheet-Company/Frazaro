[package]
name = "frazaro-core"
description = "The Frazaro language, host-free: sentences in, spreadsheets out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What crates.io shows and indexes. A package is this directory and nothing
# beside it: the four data tables the core embeds at build time live in
# data/, inside the crate, so `cargo package` ships them, and
# tools/check_crate_package.ps1 holds every build-time include to that.
readme = "README.md"
keywords = ["spreadsheet", "excel", "english", "compiler", "xlsx"]
categories = ["compilers", "parser-implementations", "wasm"]

[lib]
# rlib for the workspace's own doors; cdylib for the wasm32 build and for a
# native embedding that loads the core as a shared library.
crate-type = ["rlib", "cdylib"]

[dependencies]
