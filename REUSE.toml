# REUSE.toml - the licence map (reuse.software, specification 3.3).
#
# One repository, four licence territories, no directory moves: path globs
# resolve every file to one SPDX identifier, and tools/check_spdx.ps1
# verifies the map against the tree. Later [[annotations]] tables win when
# more than one matches a file, so the specific entries sit below the
# general ones. The reasoning is docs/CUTS.md section 4 (Bucket 2, decided
# 2026-09-04): Apache-2.0 engine, MPL-2.0 phrasebooks (file-scoped, so an
# organization's own phrasebook file stays its own), 0BSD on the one module
# copied into customers' workbooks, CC-BY-4.0 documentation. Generated
# output is covered by OUTPUT-EXCEPTION.md, not by any entry here.

version = 1
SPDX-PackageName = "Frazaro"
SPDX-PackageSupplier = "Spreadsheet Company <english@spreadsheet.company>"
SPDX-PackageDownloadLocation = "https://github.com/Spreadsheet-Company/Frazaro"

# The engine, its prelude, the corpus fixtures and goldens, the dev tooling,
# the installer, and this map itself. Since 2026-10-01 (PORT.4) the engine
# has a second implementation: the Cargo workspace (Cargo.toml, core/, cli/),
# the conformance treaty that holds both to one corpus, and the web door.
# Same territory, same terms: an implementation of the engine is the engine.
[[annotations]]
path = ["src/**", "scripts/**", "tools/**", "installer/**", "web/**", "archive/**", "core/**", "cli/**", "conformance/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "REUSE.toml", ".gitignore"]
SPDX-FileCopyrightText = "2026 Spreadsheet Company"
SPDX-License-Identifier = "Apache-2.0"

# The phrasebooks: the base corpus and every edition or dialect beside it.
# MPL-2.0 is per file - see PHRASEBOOK-TERMS.md for what that means for a
# phrasebook you write yourself (it is yours).
[[annotations]]
path = ["scripts/polyglotta/**"]
SPDX-FileCopyrightText = "2026 Spreadsheet Company"
SPDX-License-Identifier = "MPL-2.0"

# The command-line door carries a copy of the English phrasebook
# (cli/data/english.vla, held byte for byte to scripts/polyglotta/english.vla
# by tools/check_crate_data.ps1), so that an installed door needs no file
# beside it. MPL-2.0 travels with the file, which is why the frazaro crate's
# manifest says "Apache-2.0 AND MPL-2.0"; the prelude copy beside it is the
# engine's Apache-2.0, through the first table.
[[annotations]]
path = ["cli/data/english.vla"]
SPDX-FileCopyrightText = "2026 Spreadsheet Company"
SPDX-License-Identifier = "MPL-2.0"

# The runtime helper zoo. Its text above the EN_RUNTIME INJECT BOUNDARY is
# copied verbatim into customers' workbooks as Frazaro_EN_Runtime, so it
# carries the lightest terms in the repository and its own in-file header
# travels with it.
[[annotations]]
path = ["src/VLA_Runtime.bas"]
SPDX-FileCopyrightText = "2026 Spreadsheet Company"
SPDX-License-Identifier = "0BSD"

# Documentation, including the governance files at the repository root.
[[annotations]]
path = ["docs/**", "*.md", "NOTICE"]
SPDX-FileCopyrightText = "2026 Spreadsheet Company"
SPDX-License-Identifier = "CC-BY-4.0"

# The onboarding samples (LE.6): sample SOPs and their sample data, made to
# be copied into an organization's own procedures and adapted without
# ceremony - so they carry the same no-attribution terms as the runtime
# that is copied into customers' workbooks.
[[annotations]]
path = ["examples/**"]
SPDX-FileCopyrightText = "2026 Spreadsheet Company"
SPDX-License-Identifier = "0BSD"
