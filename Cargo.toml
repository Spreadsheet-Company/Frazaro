# The Cargo workspace: the language (vla-lang/), the host-free core (core/)
# and its command-line door (cli/), in that dependency order (PORT.12,
# 2026-10-08; Alonzo/CHARTER.md section 4, rule 1: an engine consumes the
# language and never the core).
#
# docs/HORIZON.md section 12 is the design; conformance/README.md is the
# treaty that holds every implementation to the one corpus in scripts/. The
# VBA in src/ is the reference implementation (SD-18) and is not a member
# here: it is built by VlaBuildAddin in Excel, as docs/DEPLOY.md describes,
# and it testifies to this workspace through the goldens it produced.
#
# Build the core for the browser and every other wasm embedding with
#   cargo build --release -p frazaro-core --target wasm32-unknown-unknown
# and tools/check_core_imports.ps1 then holds the module's import section
# at zero entries, which is SD-13 as a property of the artifact.

[workspace]
resolver = "2"
members = ["vla-lang", "core", "cli"]

[workspace.package]
# One corpus, one version: tools/check_version_twin.ps1 holds this equal to
# VLA_RELEASE_VERSION in src/VLA.bas and to the door's pin below. All three
# are bumped by hand at release (DI.3a) and nowhere else.
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Spreadsheet-Company/Frazaro"
rust-version = "1.75"

[workspace.dependencies]
# The door's one dependency, pinned exactly: `frazaro` at a version is the
# door to `frazaro-core` at the same version, because the version is the
# corpus's and not either product's. The path serves the workspace; the
# requirement is what the published manifest keeps, since crates.io resolves
# a dependency by version alone. tools/check_version_twin.ps1 holds it equal
# to the version above.
frazaro-core = { path = "core", version = "=0.8.0" }
# The language, pinned the same way by the core: `frazaro-core` at a version
# is the bridges over `vla-lang` at the same version (PORT.12), and
# tools/check_version_twin.ps1 holds this pin equal too.
vla-lang = { path = "vla-lang", version = "=0.8.0" }

[profile.release]
# Small, deterministic, and without an unwinder: a panic aborts, so the wasm
# module imports nothing to unwind with and nothing to print with.
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
